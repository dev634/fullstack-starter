# Builds the app image and pushes it to GHCR on every merge to main.
# Deployment is PULL-BASED: the VPS pulls this image itself via a systemd timer
# (see deploy/README.md). There is no inbound SSH from CI — the host's edge
# network intermittently dropped GitHub runner IPs on the non-standard SSH port
# (HTTPS/443 always worked), which made SSH-based deploys unreliable.
name: Build and push image

on:
  push:
    branches: [main]

# Never build two images for main at once.
concurrency:
  group: build-main
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build and push image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Ping the VPS to pull the just-pushed image immediately (over HTTPS/443,
      # which the host never blocks — unlike inbound SSH). Best-effort: if the
      # webhook is briefly unreachable the deploy still lands via the systemd
      # timer's periodic pull, so a hiccup here must not fail the build.
      - name: Trigger deploy on the VPS (pull via webhook)
        continue-on-error: true
        run: |
          curl -fsS --max-time 300 -X POST \
            -H "X-Deploy-Token: ${{ secrets.DEPLOY_HOOK_TOKEN }}" \
            https://devadn.com/deploy-hook
