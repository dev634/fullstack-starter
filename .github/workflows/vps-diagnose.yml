name: VPS diagnose (temporary, read-only)

# Manual, one-off diagnostic — not on push. Runs only read-only commands on
# the VPS (no config changes, no service restarts, no docker mutations) to
# check what's listening on port 21 and whether sshd/fail2ban hardening is
# actually in effect. Meant to be deleted once its output has been read.
on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT || 22 }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -T 20 -p "$VPS_PORT" "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Read-only diagnostics
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || 22 }}
        run: |
          set -euo pipefail
          COMMON="-i $HOME/.ssh/deploy_key -o ConnectTimeout=20 -o BatchMode=yes"
          ssh $COMMON -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" '
            echo "== whoami / sudo -n check =="
            whoami
            sudo -n true 2>&1 && echo "sudo -n: OK (passwordless)" || echo "sudo -n: NOT available without a password"

            echo
            echo "== listening TCP sockets (ss -tln, no sudo) =="
            ss -tln

            echo
            echo "== listening TCP sockets with process names (sudo -n ss -tlnp) =="
            sudo -n ss -tlnp 2>&1 || echo "(skipped, no passwordless sudo)"

            echo
            echo "== whats on port 21 specifically =="
            sudo -n ss -tlnp 2>/dev/null | grep ":21 " || ss -tln | grep ":21 " || echo "nothing found matching :21"
            sudo -n lsof -i :21 2>&1 || echo "(lsof skipped/unavailable)"

            echo
            echo "== docker containers (port mappings) =="
            docker ps --format "table {{.Names}}\t{{.Image}}\t{{.Ports}}" 2>&1 || echo "(docker ps failed)"

            echo
            echo "== ufw status =="
            sudo -n ufw status verbose 2>&1 || echo "(ufw status skipped/unavailable)"

            echo
            echo "== sshd_config (permit root / password auth / port) =="
            (cat /etc/ssh/sshd_config 2>&1 || sudo -n cat /etc/ssh/sshd_config 2>&1) | grep -Ei "^[^#]*\b(Port|PermitRootLogin|PasswordAuthentication|PubkeyAuthentication|MaxAuthTries|AllowUsers|ChallengeResponseAuthentication)\b" || echo "(sshd_config unreadable)"

            echo
            echo "== fail2ban =="
            sudo -n fail2ban-client status 2>&1 || echo "(fail2ban-client status skipped/unavailable)"
            sudo -n fail2ban-client status sshd 2>&1 || echo "(fail2ban-client status sshd skipped/unavailable)"
            systemctl is-active fail2ban 2>&1 || true
          '
